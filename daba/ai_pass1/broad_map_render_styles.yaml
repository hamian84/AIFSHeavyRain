  QL_T500_Z500: &aifshr_z500_temp_style
    # Annual fixed 500-hPa temperature scale: discrete 4 C intervals.
    # Four AIFSHR chromatic groups: violet (-60..-40), navy (-40..-20),
    # blue (-20..-4), red (+4..+12), with a white -4..+4 neutral band.
    # Individual 4 C steps use progressively changing AIFSHR canonical RGB swatches.
    # First/last colors represent out-of-range under/over extensions.
    levels:
    - -60
    - -56
    - -52
    - -48
    - -44
    - -40
    - -36
    - -32
    - -28
    - -24
    - -20
    - -16
    - -12
    - -8
    - -4
    - 0
    - 4
    - 8
    - 12
    ticks:
    - -60
    - -56
    - -52
    - -48
    - -44
    - -40
    - -36
    - -32
    - -28
    - -24
    - -20
    - -16
    - -12
    - -8
    - -4
    - 0
    - 4
    - 8
    - 12
    colors:
    - '#3D075B'  # below -60 C
    - *aifshr_precip_rgb_20  # -60 to -56: dark violet
    - *aifshr_precip_rgb_19  # -56 to -52: violet
    - *aifshr_precip_rgb_18  # -52 to -48: violet
    - *aifshr_precip_rgb_17  # -48 to -44: violet
    - *aifshr_precip_rgb_16  # -44 to -40: light violet
    - *aifshr_precip_rgb_15  # -40 to -36: deep navy
    - *aifshr_precip_rgb_14  # -36 to -32: navy
    - *aifshr_precip_rgb_13  # -32 to -28: navy
    - *aifshr_precip_rgb_12  # -28 to -24: navy
    - *aifshr_precip_rgb_11  # -24 to -20: light navy
    - *aifshr_precip_rgb_10  # -20 to -16: deep blue
    - *aifshr_precip_rgb_09  # -16 to -12: blue
    - *aifshr_precip_rgb_08  # -12 to -8: blue
    - *aifshr_precip_rgb_06  # -8 to -4: light blue
    - '#FFFFFF'  # -4 to 0: white
    - '#FFFFFF'  # 0 to +4: white
    - *aifshr_precip_rgb_21  # +4 to +8: light red
    - *aifshr_precip_rgb_23  # +8 to +12: deep red
    - *aifshr_precip_rgb_25  # above +12 C: dark red
    extend: both
    # Same shared contour+halo renderer as 300 hPa and omega/height products.
    contour_color: '#4A3426'
    contour_linewidth: 1.05
    contour_halo_color: '#FFFFFF'
    contour_halo_linewidth: 2.4
    contour_label_halo_linewidth: 3.4
    contour_levels:
    - 5400
    - 5440
    - 5480
    - 5520
    - 5560
    - 5600
    - 5640
    - 5680
    - 5720
    - 5760
    - 5800
    - 5840
    - 5880
    - 5920
    - 5960
    title_info_lines:
    - 초기시각 {init_time_kst} KST | 유효시각 {valid_time_kst} KST
    - '음영: 500 hPa 기온 (°C) | 등치선: 500 hPa 지위고도 (gpm)'
  # Backward/forward compatible style name for Step05 product QL_Z500_T500.
  # Both product IDs resolve to the single shared style definition above.
  QL_Z500_T500: *aifshr_z500_temp_style
