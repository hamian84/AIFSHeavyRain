# AIFSHeavyRain AI 탐색 Pass1의 운영권역 계층입니다.
#
# 공간 역할:
# - source_corridor: 상류 시스템·수분 경로 맥락이며 최종 위험 순위를 부여하지 않습니다.
# - operational_land: 대한민국 육상 운영권역이며 Pass1 위험 순위 대상입니다.
# - marine_macro: 광역 해상 운영권역이며 관련 시 Pass1 위험 순위 대상입니다.
# - marine_detail: Pass2에 예약된 상세 해상권역이며 Pass1에서 계산하지 않습니다.
#
# 모든 bbox는 WGS84 십진도이며 후보와 권역의 빠른 사전 교차검사용입니다.
# operational_land의 실제 소속은 고정 AIFS 격자 매핑으로 판정하며 bbox나 Natural Earth 육지
# 마스크를 지역 경계로 사용하지 않습니다. 해상/발원 통로의 육지·해양 마스크는 기존 로컬
# Natural Earth 육지 shapefile을 사용합니다.

policy_id: ai_discovery_operational_regions_v1
policy_version: 1.2.0
coordinate_reference_system: EPSG:4326

mask_resources:
  land_shapefile_candidates:
    - daba/map/ne_50m_land/ne_50m_land.shp
    - daba/map/ne_10m_land/ne_10m_land.shp
  operational_land_grid_mapping_candidates:
    - daba/analysis/aifs_operational_region_grid_map.csv
  operational_land_grid_coordinate_tolerance_degrees: 1.0e-7
  failure_policy: error

region_role_contract:
  source_corridor:
    stage: pass1
    enabled_in_pass1: true
    eligible_for_risk_rank: false
  operational_land:
    stage: pass1
    enabled_in_pass1: true
    eligible_for_risk_rank: true
  marine_macro:
    stage: pass1
    enabled_in_pass1: true
    eligible_for_risk_rank: true
  marine_detail:
    stage: pass2
    enabled_in_pass1: false
    eligible_for_risk_rank: false

